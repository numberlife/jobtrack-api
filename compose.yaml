services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobtrack
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jobtrack_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack -d jobtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobtrack_data:
